<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-MOTORS Colombia | Próximamente</title>
<meta name="description" content="E-MOTORS Colombia. Próximamente.">
<meta property="og:title" content="E-MOTORS Colombia">
<meta property="og:description" content="Próximamente.">
<meta property="og:image" content="/img/emotors-logo.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root{--negro:#000;--blanco:#fff;--gris:#8A939B;--amarillo:#FFC300}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--negro);color:var(--blanco);font-family:"Barlow Condensed",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

  .escena{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(40px,7vh,72px);padding:24px 16px}

  /* linea horizontal que cruza la pantalla, eco del isotipo */
  .eje{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.08);overflow:hidden}
  .eje::after{content:"";position:absolute;top:0;left:-30%;width:30%;height:1px;background:linear-gradient(90deg,transparent,var(--amarillo),transparent);animation:barrido 4s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes barrido{to{left:100%}}

  .logo{position:relative;width:clamp(220px,30vw,400px);height:auto;opacity:0;animation:entrar 1.4s .2s ease forwards}
  .proximamente{position:relative;font-weight:500;font-size:clamp(13px,1.3vw,16px);letter-spacing:.6em;margin-right:-.6em;text-transform:uppercase;color:var(--amarillo);opacity:0;animation:entrar 1.4s .5s ease forwards}

  .conteo{position:relative;display:flex;align-items:flex-start;gap:clamp(10px,2.4vw,36px);background:var(--negro);padding:0 clamp(8px,2vw,28px);opacity:0;animation:entrar 1.4s .8s ease forwards}
  .bloque{text-align:center;min-width:1.2em}
  .bloque b{display:block;font-weight:300;font-size:clamp(56px,11vw,168px);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .bloque small{display:block;margin-top:14px;font-weight:500;font-size:clamp(10px,.9vw,12px);letter-spacing:.4em;margin-right:-.4em;text-transform:uppercase;color:var(--gris)}
  .sep{font-weight:300;font-size:clamp(40px,8vw,120px);line-height:1.05;color:var(--amarillo);animation:latido 1s steps(1) infinite}
  @keyframes latido{50%{opacity:.25}}
  @keyframes entrar{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .lanzado .conteo{display:none}
  @media (prefers-reduced-motion:reduce){.eje::after,.sep{animation:none}.logo,.proximamente,.conteo{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="escena">
  <div class="eje" aria-hidden="true"></div>
  <img class="logo" src="/img/emotors-logo.png" alt="E-MOTORS Colombia" width="1400" height="335">
  <div class="conteo" role="timer" aria-label="Tiempo para el lanzamiento">
    <div class="bloque"><b id="d">00</b><small>Días</small></div>
    <span class="sep" aria-hidden="true">:</span>
    <div class="bloque"><b id="h">00</b><small>Horas</small></div>
    <span class="sep" aria-hidden="true">:</span>
    <div class="bloque"><b id="m">00</b><small>Min</small></div>
    <span class="sep" aria-hidden="true">:</span>
    <div class="bloque"><b id="s">00</b><small>Seg</small></div>
  </div>
  <p class="proximamente">Próximamente</p>
</div>
<script>
  // Fecha de lanzamiento, hora Colombia (UTC-5)
  var LANZAMIENTO = "2026-11-16T10:00:00-05:00";
  var meta = new Date(LANZAMIENTO).getTime();
  function dos(n){ return (n < 10 ? "0" : "") + n; }
  function tic(){
    var r = Math.max(0, meta - Date.now());
    if (!r) { document.body.classList.add("lanzado"); return; }
    var s = Math.floor(r / 1000);
    document.getElementById("d").textContent = dos(Math.floor(s / 86400));
    document.getElementById("h").textContent = dos(Math.floor(s % 86400 / 3600));
    document.getElementById("m").textContent = dos(Math.floor(s % 3600 / 60));
    document.getElementById("s").textContent = dos(s % 60);
    setTimeout(tic, 1000 - Date.now() % 1000);
  }
  tic();
</script>
</body>
</html>
